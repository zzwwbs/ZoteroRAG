bug_details:
  BUG-001:
    severity: 'CRITICAL - SECURITY'
    found_by: 'Quinn (Test Architect)'
    found_date: '2025-01-12T22:00:00Z'
    location: 'src/zoterorag/config/settings_manager.py:143'
    description: 'set_api_key_securely() stored plaintext API key in self._settings.api_key in memory after successful keyring storage. Subsequent calls to set_enable_ai_analysis() or set_zotero_path() would call save_settings() which wrote the plaintext key to settings.json.'
    reproduction_steps:
      - 'Call manager.set_api_key_securely("secret-key")'
      - 'Call manager.set_enable_ai_analysis(True)'
      - 'Check settings.json file'
      - 'Observe: api_key field contains plaintext "secret-key"'
    impact: 'API keys exposed in plaintext configuration files, violating AC 5.2.2'
    fix_applied: 'Changed line 143 from api_key=api_key to api_key=None'
    fix_rationale: 'Prevent plaintext key from persisting in memory. Key is only stored in OS keyring and retrieved when needed.'
    regression_test: 'test_api_key_not_leaked_to_plaintext_config_when_using_keyring'
    fixed_date: '2025-01-12T22:10:00Z'
    verified_date: '2025-01-12T22:15:00Z'
    status: 'FIXED and VERIFIED'


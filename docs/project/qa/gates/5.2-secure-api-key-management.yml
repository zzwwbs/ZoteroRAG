    no_plaintext_memory: 'PASS - self._settings.api_key set to None after keyring storage'
    just_in_time_retrieval: 'PASS - Services call get_api_key() immediately before API requests'
    error_handling: 'PASS - Keyring failures logged without exposing keys, fallback to None'

